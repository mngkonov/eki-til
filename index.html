<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Екі тіл">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#132026" media="(prefers-color-scheme: dark)">
<meta name="description" content="Американский английский и казахский: уроки, произношение, собеседник и повторение.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Екі тіл</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one app column; top bar with a steppe ornament band, tabbed views, full-screen lesson overlay */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#E2E8EC; --ink:#122129; --muted:#5A6A73; --line:#D2DBE0;
  --sky:#0B7BA6; --gold:#C98A12; --brick:#B9442C; --ok:#1C8556; --ok-bg:#DDF2E7; --bad:#C23838; --bad-bg:#F8E0E0;
  --accent:var(--sky); --accent-2:var(--gold); --on-accent:#FFFFFF;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1317; --surface:#132026; --surface-2:#1A2B33; --ink:#E4EDF0; --muted:#92A4AD; --line:#253740;
  --sky:#3AB2DD; --gold:#EDB540; --brick:#EC6E53; --ok:#45C38A; --ok-bg:#143326; --bad:#F06A6A; --bad-bg:#3A1A1C; --on-accent:#08141A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1317; --surface:#132026; --surface-2:#1A2B33; --ink:#E4EDF0; --muted:#92A4AD; --line:#253740;
  --sky:#3AB2DD; --gold:#EDB540; --brick:#EC6E53; --ok:#45C38A; --ok-bg:#143326; --bad:#F06A6A; --bad-bg:#3A1A1C; --on-accent:#08141A; color-scheme:dark }
body[data-lang="en"]{ --accent:var(--brick); --accent-2:var(--sky) }
body[data-lang="kk"]{ --accent:var(--sky); --accent-2:var(--gold) }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); font-weight:700; text-wrap:balance; margin:0; letter-spacing:-.01em}
.wrap{max-width:960px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.label{font-size:11px; text-transform:uppercase; letter-spacing:.09em; font-weight:700; color:var(--muted)}

/* top bar */
.top{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:20}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
.top-row{display:flex; align-items:center; gap:12px; padding-block:12px; flex-wrap:wrap}
.logo{display:flex; align-items:baseline; gap:8px; margin-right:auto}
.logo b{font-family:var(--f-display); font-size:20px; letter-spacing:-.02em}
.logo span{font-size:12px; color:var(--muted)}
.seg{display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px}
.seg button{border:0; background:transparent; padding:7px 14px; border-radius:999px; font-weight:700; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.chips{display:flex; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:13px; padding:6px 10px; border-radius:999px; background:var(--surface-2); font-variant-numeric:tabular-nums}
.chip svg{width:15px; height:15px}
.ornament{display:block; width:100%; height:12px; color:var(--accent); opacity:.55}
body[data-lang="en"] .orn-kk, body[data-lang="kk"] .orn-en{display:none}
.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0; background:none; padding:10px 12px; font-weight:700; font-size:14px; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.view{display:grid; gap:20px}

/* hero / today */
.today{display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.ring{width:96px; height:96px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .num{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-family:var(--f-display); font-size:18px; line-height:1.1}
.ring .num small{display:block; font-family:var(--f-body); font-size:11px; color:var(--muted); font-weight:600}
.today h1{font-size:clamp(20px,3.6vw,28px)}
.today-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.btn{border:0; border-radius:12px; padding:12px 18px; font-weight:800; font-size:15px; background:var(--accent); color:var(--on-accent); box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.btn.ghost{background:var(--surface-2); color:var(--ink); box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.wide{width:100%}

/* levels path */
.level{display:grid; gap:12px}
.level-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.level-head h2{font-size:18px}
.badge{font-family:var(--f-display); font-size:12px; padding:4px 9px; border-radius:8px; background:var(--accent); color:var(--on-accent)}
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.topic{display:grid; gap:6px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; position:relative; min-width:0}
.topic:hover{border-color:var(--accent)}
.topic .t{font-weight:800; font-size:16px}
.topic .s{font-size:13px; color:var(--muted)}
.topic .meter{height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:4px}
.topic .meter i{display:block; height:100%; background:var(--ok)}
.topic .flag{position:absolute; top:12px; right:12px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px}
.flag.done{background:var(--ok-bg); color:var(--ok)}
.flag.next{background:var(--accent); color:var(--on-accent)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; display:grid; gap:12px; min-width:0}
.panel h2{font-size:18px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.stat{background:var(--surface-2); border-radius:12px; padding:14px}
.stat b{display:block; font-family:var(--f-display); font-size:24px; font-variant-numeric:tabular-nums}
.bars{display:grid; grid-template-columns:repeat(14,1fr); gap:6px; align-items:end; height:120px}
.bars div{display:grid; gap:4px; justify-items:center; align-content:end; height:100%}
.bars i{display:block; width:100%; max-width:22px; border-radius:5px 5px 2px 2px; background:var(--accent); min-height:3px}
.bars i.zero{background:var(--surface-2)}
.bars span{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums}

/* grammar */
details.gram{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
details.gram summary{cursor:pointer; padding:16px 20px; font-weight:800; display:flex; gap:10px; align-items:center; list-style:none}
details.gram summary::-webkit-details-marker{display:none}
details.gram summary::after{content:"+"; margin-left:auto; font-family:var(--f-display); color:var(--muted)}
details.gram[open] summary::after{content:"–"}
.gram-body{padding:0 20px 20px; display:grid; gap:14px; max-width:72ch}
.gram-body h3{font-size:14px; font-family:var(--f-body); font-weight:800}
.gram-body p{margin:0}
.ex{background:var(--surface-2); border-radius:10px; padding:10px 12px; display:grid; gap:2px; font-size:14px}
.ex b{font-weight:700}
.ex span{color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse; font-size:14px; min-width:420px}
.tbl td,.tbl th{border-bottom:1px solid var(--line); padding:6px 10px; text-align:left}
.tbl th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}

/* alphabet */
.letters{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
.letter{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:grid; gap:6px; text-align:left}
.letter .big{font-family:var(--f-display); font-size:34px; color:var(--accent); line-height:1}
.letter .w{font-weight:800}
.letter .h{font-size:13px; color:var(--muted)}

/* review cards */
.flash{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:32px 20px; min-height:240px; display:grid; place-items:center; text-align:center; gap:10px}
.flash .front{font-family:var(--f-display); font-size:clamp(22px,5vw,34px); overflow-wrap:anywhere}
.flash .back{font-size:18px; font-weight:700}
.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.rate button{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 4px; font-weight:800; font-size:13px; display:grid; gap:2px}
.rate button small{font-weight:600; color:var(--muted); font-size:11px}
.rate .again{color:var(--bad)} .rate .good{color:var(--ok)}

.speak{border:0; background:var(--surface-2); width:40px; height:40px; border-radius:50%; display:inline-grid; place-items:center; flex:none}
.speak svg{width:20px; height:20px; color:var(--accent)}
.speak.big{width:88px; height:88px} .speak.big svg{width:40px; height:40px}

/* lesson overlay */
.overlay{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-top{display:flex; align-items:center; gap:14px; padding-block:14px}
.close{border:0; background:none; font-size:26px; line-height:1; color:var(--muted); padding:4px 8px}
.prog{flex:1; height:12px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .3s}
.ov-body{flex:1; overflow-y:auto}
.ov-body .wrap{max-width:640px; padding-block:12px 24px; display:grid; gap:18px}
.q-title{font-size:clamp(18px,3.5vw,22px)}
.prompt{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.prompt .p{font-size:clamp(20px,4.5vw,28px); font-weight:800; overflow-wrap:anywhere; min-width:0}
.options{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:14px 16px; font-weight:700; font-size:16px; box-shadow:0 2px 0 var(--line); min-width:0}
.opt .k{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; flex:none}
.opt.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default}
.answer-line{min-height:64px; border-bottom:2px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; padding:8px 0; align-content:flex-start}
.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.tok{border:2px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; font-weight:700; box-shadow:0 2px 0 var(--line)}
.tok.used{visibility:hidden}
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:grid; gap:10px; align-content:start; min-width:0}
.match .opt{justify-content:center; text-align:center; font-size:15px; padding:12px 8px}
.match .opt.gone{opacity:.35; border-color:var(--ok)}
.typebox{width:100%; font:inherit; font-size:18px; font-weight:600; padding:14px 16px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink)}
.kbd{display:flex; flex-wrap:wrap; gap:6px}
.kbd button{border:1px solid var(--line); background:var(--surface); border-radius:8px; min-width:38px; padding:6px 8px; font-weight:800; font-size:16px}
.ov-foot{border-top:1px solid var(--line); background:var(--surface)}
.ov-foot .wrap{max-width:640px; padding-block:14px; display:grid; gap:10px}
.ov-foot.ok{background:var(--ok-bg); border-color:var(--ok)}
.ov-foot.bad{background:var(--bad-bg); border-color:var(--bad)}
.fb-title{font-weight:800; font-size:17px}
.ov-foot.ok .fb-title{color:var(--ok)} .ov-foot.bad .fb-title{color:var(--bad)}
.ov-foot.ok .btn{background:var(--ok); box-shadow:0 3px 0 color-mix(in srgb, var(--ok) 60%, #000); color:var(--surface)}
.ov-foot.bad .btn{background:var(--bad); box-shadow:0 3px 0 color-mix(in srgb, var(--bad) 60%, #000); color:var(--surface)}
.study-card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:28px 20px; display:grid; gap:10px; justify-items:center; text-align:center}
.study-card .w{font-family:var(--f-display); font-size:clamp(24px,6vw,36px); overflow-wrap:anywhere}
.study-card .r{font-size:18px; font-weight:700; color:var(--muted)}
.result{text-align:center; display:grid; gap:14px; justify-items:center; padding-top:24px}
.result .score{font-family:var(--f-display); font-size:56px; color:var(--accent)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px; z-index:80; max-width:calc(100% - 32px)}
.note{font-size:13px; color:var(--muted)}
body:has(.overlay) .toast{bottom:auto; top:calc(64px + env(safe-area-inset-top,0px))}
.plan{display:grid; gap:10px; margin:0; padding-left:20px}
.plan li{padding-left:4px}
.goal-sel{display:flex; gap:8px; flex-wrap:wrap}
.hearts{display:inline-flex; align-items:center; gap:5px; font-weight:800; color:var(--bad); font-variant-numeric:tabular-nums}
.hearts svg{width:22px; height:22px}
.combo{display:inline-block; margin-left:8px; font-size:13px; font-weight:800; padding:2px 9px; border-radius:999px; background:var(--gold); color:#1b1300}
.mic{width:96px; height:96px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.mic svg{width:42px; height:42px}
.mic.on{background:var(--bad); animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--bad) 55%, transparent)}100%{box-shadow:0 0 0 24px transparent}}
.heard{font-size:18px; font-weight:700; text-align:center; min-height:28px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.heard .ok{color:var(--ok)} .heard .miss{color:var(--bad); text-decoration:underline wavy}
.heard .part{color:var(--muted); font-style:italic}
.stars{display:flex; gap:4px; justify-content:center}
.stars svg{width:30px; height:30px}
.stars.sm svg{width:16px; height:16px}
.star-on{color:var(--gold)} .star-off{color:var(--surface-2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
.games{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.game{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; text-align:left; border:0; border-radius:var(--r); padding:18px; background:var(--ink); color:var(--bg)}
.game .gi{width:52px; height:52px; border-radius:14px; display:grid; place-items:center; background:var(--accent); color:var(--on-accent)}
.game .gi svg{width:28px; height:28px}
.game b{font-family:var(--f-display); font-size:16px; display:block}
.game span{font-size:13px; opacity:.75}
.topic.locked{opacity:.5}
.ach-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
.ach{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; background:var(--surface-2); border-radius:12px; padding:12px; opacity:.5}
.ach.got{opacity:1; background:color-mix(in srgb, var(--gold) 18%, var(--surface))}
.ach .medal{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--line); font-family:var(--f-display); font-size:13px}
.ach.got .medal{background:var(--gold); color:#1b1300}
.ach b{display:block; font-size:13px} .ach span{font-size:12px; color:var(--muted)}
.bz-score{font-family:var(--f-display); font-size:44px; color:var(--accent); text-align:center; line-height:1}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:90; width:100%; height:100%}


.hero-stats{display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:12px}
.hero{background:var(--accent); color:var(--on-accent); border-radius:12px; padding:14px 16px; display:grid; align-content:center}
.hero b{font-family:var(--f-display); font-size:48px; line-height:1; font-variant-numeric:tabular-nums}
.hero span{font-weight:700} .hero small{opacity:.8; font-weight:600}
.chart{display:grid; grid-template-columns:28px 1fr; grid-template-rows:160px auto auto; column-gap:8px}
.yax{display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; margin-block:-7px}
.plot{position:relative; display:grid; gap:2px; align-items:end; height:160px}
.plot .gl{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--line)}
.plot .gl.base{border-top:1px solid var(--muted); opacity:.5}
.plot .col{height:100%; display:flex; align-items:flex-end; justify-content:center; cursor:default; position:relative; z-index:1}
.plot .col b{display:block; width:100%; max-width:18px; background:var(--accent); border-radius:4px 4px 0 0}
.plot .col:hover b{filter:brightness(1.15)}
.plot .col:hover{background:color-mix(in srgb, var(--accent) 8%, transparent); border-radius:4px}
.xax{grid-column:2; display:grid; gap:2px; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:4px}
.xax span{text-align:center; white-space:nowrap; overflow:visible}
.unit{grid-column:2; font-size:11px; color:var(--muted); margin-top:2px}
.heat-wrap{display:grid; grid-template-columns:auto 1fr; gap:6px; overflow-x:auto}
.heat-days{display:grid; grid-template-rows:repeat(7,1fr); font-size:10px; color:var(--muted); gap:3px}
.heat{display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:minmax(12px,1fr); gap:3px}
.heat i, .heat-legend i{display:block; aspect-ratio:1; border-radius:3px; min-width:12px}
.h0{background:var(--surface-2)} .hf{background:transparent}
.h1{background:color-mix(in srgb, var(--accent) 30%, var(--surface-2))}
.h2{background:color-mix(in srgb, var(--accent) 55%, var(--surface-2))}
.h3{background:color-mix(in srgb, var(--accent) 78%, var(--surface-2))}
.h4{background:var(--accent)}
.heat-legend{display:flex; gap:4px; align-items:center; justify-content:flex-end; font-size:11px; color:var(--muted)}
.heat-legend i{width:12px}
table.cmp td, table.cmp th{font-variant-numeric:tabular-nums}

let GL = {};
function glossary(lang){
  const sig = (S.langs[lang].gen||[]).length;
  if(GL[lang] && GL[lang].sig===sig) return GL[lang].m;
  const m = new Map();
  const add = (t,r) => { const k = String(t).toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?;:«»"()]/g,"").trim(); if(k && !m.has(k)) m.set(k, r); };
  for(const [k,v] of Object.entries(FN[lang])) add(k,v);
  for(const t of allTopics(lang)) for(const s of t.w){ const p = pair(s); add(p.t, p.r); if(lang==="en" && /^to /i.test(p.t)) add(p.t.slice(3), p.r); }
  for(const p of PRON[lang]) for(const s of p.items){ const q = pair(s); if(!q.t.includes(" ")) add(q.t, q.r); }
  /* Kazakh verbs are stored as infinitives (келу): keep their stems (кел-) for matching inflected forms */
  const stems = new Map();
  if(lang==="kk") for(const [k,v] of m) if(!k.includes(" ") && /[^аеыі]у$/.test(k) && k.length>=3){ const st = k.slice(0,-1); if(!stems.has(st)) stems.set(st, {k, v}); }
  m.stems = stems;
  GL[lang] = {sig, m}; return m;
}
function glLookup(word, lang, m){
  const w = word.toLowerCase().replace(/[’`]/g,"'");
  if(m.has(w)) return m.get(w);
  if(lang==="en"){
    for(const [suf,rep] of [["'s",""],["ies","y"],["es",""],["s",""],["ed",""],["ed","e"],["d",""],["ing",""],["ing","e"],["ly",""]]){
      if(w.endsWith(suf)){ const b = w.slice(0,-suf.length)+rep; if(b.length>1 && m.has(b)) return `${m.get(b)} (${b})`; } }
    return null;
  }
  let best = null;
  for(const [s,o] of m.stems||[]) if(w.startsWith(s) && w.length>s.length && (!best || s.length>best.s.length)) best = {s, k:o.k, v:o.v};
  for(const [k,v] of m){
    if(k.includes(" ") || k.length<3) continue;
    const alt = {"п":"б","қ":"ғ","к":"г"}[k.slice(-1)];
    for(const s of alt ? [k, k.slice(0,-1)+alt] : [k]) if(w.startsWith(s) && w.length>s.length && (!best || s.length>best.s.length)) best = {s,k,v};
  }
  return best ? `${best.v} (${best.k} + окончание)` : null;
}
const hintsOff = () => !!((LS && LS.hard) || (QS && QS.hard));
/* wraps every known word in a tappable span with its translation */
function gl(text, lang, force){
  if(!force && hintsOff()) return esc(text);
  const m = glossary(lang), parts = String(text).split(/([\p{L}\p{N}'’\-]+)/u);
  let out = "";
  for(let i=0;i<parts.length;i++){
    if(i%2===0){ out += esc(parts[i]); continue; }
    let hit = false;
    for(let n=3; n>=2 && !hit; n--){
      const end = i+2*(n-1); if(end>=parts.length) continue;
      let ok = true; for(let j=i+1;j<end;j+=2) if(parts[j]!==" ") ok=false; if(!ok) continue;
      const ph = parts.slice(i,end+1).join(""), k = ph.toLowerCase().replace(/[’`]/g,"'");
      if(m.has(k)){ out += `<span class="gw" data-l="${lang}" data-tip="${esc(m.get(k))}">${esc(ph)}</span>`; i = end; hit = true; }
    }
    if(hit) continue;
    const r = glLookup(parts[i], lang, m);
    out += r ? `<span class="gw" data-l="${lang}" data-tip="${esc(r)}">${esc(parts[i])}</span>` : esc(parts[i]);
  }
  return out;
}

  S.hist[k] = (S.hist[k]||0) + n; S.totalXp += n;
  LL.hist[k] = (LL.hist[k]||0) + n; LL.xp += n;
  if(LL.streak.last !== k){ LL.streak.count = LL.streak.last === todayKey(new Date(Date.now()-DAY)) ? LL.streak.count+1 : 1; LL.streak.last = k; }

  if(S.streak.last !== k){ S.streak.count = S.streak.last === y ? S.streak.count+1 : 1; S.streak.last = k; }

function plural(n,a,b,c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11?a: m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c; }
function srs(card, q){
  const c = {...card};
  if(q<3){ c.r=0; c.i=0; c.d=Date.now()+10*60000; return c; }
  c.r=(c.r||0)+1;
  c.i = c.r===1 ? 1 : c.r===2 ? (q===3?2:q===5?4:3) : Math.max(1, Math.round((c.i||1)*(q===3?1.2:c.e)*(q===5?1.3:1)));
  c.e = Math.max(1.3, (c.e||2.5) + 0.1 - (5-q)*(0.08+(5-q)*0.02));
  c.d = Date.now() + c.i*DAY; return c;
}
function fmtInt(key,q){ const c = srs(L().cards[key]||{e:2.5,i:0,r:0}, q); return c.i<1?"<10 мин": c.i===1?"1 день": `${c.i} ${plural(c.i,"день","дня","дней")}`; }

function langStats(l){

  return {streak:streakNow(l), best:L2.maxStreak||0, days:days.size, min:Math.round(sec/60), xp:L2.xp||0, today:Math.round((L2.time[todayKey()]||0)/60)};
}

function niceMax(v){ if(v<=5) return 5; if(v<=10) return 10; if(v<=20) return 20; if(v<=30) return 30; if(v<=60) return 60; return Math.ceil(v/30)*30; }

let LS = null; // lesson session
const isTyped = q => q.ty==="type" || q.ty==="dict" || !!q.typed;
function buildQuiz(topic, hard){
  const lang = S.lang, ws = words(topic);
  const lvTopics = course().filter(t=>t.lv===topic.lv);
  const pool = lvTopics.flatMap(words);
  const others = w => shuffle(pool.filter(p=>p.t!==w.t && p.r!==w.r));
  const xpool = lvTopics.flatMap(t=>t.x.map(pair));
  const audio = canSpeak(lang), pp = picPool(lang);
  const qs = [];
  const types = shuffle(["t2r","r2t","type","listen","t2r","r2t","type","listen"]);
  let pics = 0;
  ws.forEach((w,i)=>{
    let ty = types[i % types.length];
    const long = w.t.split(" ").length>3 || w.t.length>22;
    const pk = picKey(w.r);
    if(pk && pics<2 && pp.length>=4){
      const pw = {...w, pic:pk}, ds = shuffle(pp.filter(p=>p.pic!==pk && p.t!==w.t)).slice(0,3);
      if(hard) qs.push({ty:"pic", w:pw, typed:true, ans:w.t});
      else if(pics===0) qs.push({ty:"pic", w:pw, opts:shuffle([w.t, ...ds.map(d=>d.t)]), ans:w.t});
      else { const popts = shuffle([pw, ...ds]); qs.push({ty:"pic2", w:pw, popts, opts:popts.map(p=>p.t), ans:w.t}); }
      pics++; return;
    }
    if(ty==="listen" && !audio) ty="t2r";
    if(ty==="type" && long) ty="r2t";
    if(ty==="listen" && long) ty="t2r";
    if(hard){ if((ty==="t2r"||ty==="r2t") && !long) ty="type"; if(ty==="listen") ty="dict"; }
    const ds = others(w).slice(0,3);
    if(ty==="t2r") qs.push({ty, w, opts:shuffle([w.r, ...ds.map(d=>d.r)]), ans:w.r});
    else if(ty==="r2t" || ty==="listen") qs.push({ty, w, opts:shuffle([w.t, ...ds.map(d=>d.t)]), ans:w.t});
    else qs.push({ty, w, ans:w.t});
  });
  const mws = ws.filter(w=>w.t.length<=26);
  if(mws.length>=3) qs.splice(Math.floor(qs.length/2), 0, {ty:"match", items:shuffle(mws).slice(0,5)});
  const gqs = topic.gq || shuffle(gqOf(lang, topic.lv)).slice(0,1);
  gqs.forEach(g=>qs.push({ty:"gq", g, opts:shuffle([g.a, ...g.w]), ans:g.a}));
  const xs = topic.x.map(pair);
  if(xs.length){
    const p0 = xs[0], ds = shuffle(xpool.filter(p=>p.r!==p0.r)).slice(0,3).map(p=>p.r);
    if(ds.length>=2) qs.push({ty:"tr", w:p0, opts:shuffle([p0.r, ...ds]), ans:p0.r});
  }
  if(audio && xs.length>1){
    const p1 = xs[1], ds = shuffle(xpool.filter(p=>p.r!==p1.r)).slice(0,3).map(p=>p.r);
    if(ds.length>=2) qs.push({ty:"lr", w:p1, opts:shuffle([p1.r, ...ds]), ans:p1.r});
  }
  xs.forEach((p,i)=>{
    if(audio && i===xs.length-1 && xs.length>1) qs.push({ty:"dict", w:p, ans:p.t});
    else qs.push({ty:"build", w:p, toks:shuffle(p.t.split(" ").map((x,i)=>({x,i}))), ans:p.t});
  });
  const sayItem = xs.length ? xs.reduce((a,b)=>a.t.length<=b.t.length?a:b) : ws[0];
  if(sayItem) qs.push({ty:"say", w:sayItem, ans:sayItem.t});
  return qs;
}
function buildPics(topic, hard){
  const pp = picPool(S.lang);
  return topic.ws.map((w,i)=>{
    const ds = shuffle(pp.filter(p=>p.pic!==w.pic)).slice(0,3);
    if(hard) return {ty:"pic", w, typed:true, ans:w.t};
    if(i%2){ const popts = shuffle([w, ...ds]); return {ty:"pic2", w, popts, opts:popts.map(p=>p.t), ans:w.t}; }
    return {ty:"pic", w, opts:shuffle([w.t, ...ds.map(d=>d.t)]), ans:w.t};
  });
}
function buildDlg(topic, hard){
  const d = topic.d, audio = canSpeak(S.lang);
  const qs = d.qs.map(a=>({ty:"dq", text:a[0], opts:shuffle(a.slice(1)), ans:a[1]}));
  const pick = shuffle(d.lines.filter(l=>{ const n=l[1].split(" ").length; return n>=3 && n<=9; }));
  if(pick[0]){ const w={t:pick[0][1], r:pick[0][2]};
    qs.push(hard && audio ? {ty:"dict", w, ans:w.t} : {ty:"build", w, toks:shuffle(w.t.split(" ").map((x,i)=>({x,i}))), ans:w.t}); }
  if(pick[1] && audio){ const l=pick[1], ds=shuffle(d.lines.filter(x=>x!==l)).slice(0,3).map(x=>x[2]);
    qs.push({ty:"lr", w:{t:l[1], r:l[2]}, opts:shuffle([l[2], ...ds]), ans:l[2]}); }
  if(pick[2]) qs.push({ty:"say", w:{t:pick[2][1], r:pick[2][2]}, ans:pick[2][1]});
  return qs;
}
/* o: {study, intro, first, build, hard, again} — hard undefined means "let the person choose" */
function startLS(topic, o){
  LS = {topic, lang:S.lang, si:0, qs:[], qi:0, total:0, right:0, wrong:new Set(), state:null, sel:null, combo:0, bonus:0,
        hard:!!o.hard, mic:null, sayRes:null, build:o.build||buildQuiz, first:o.first||"quiz", again:o.again, playing:-1, showText:false};
  LS.phase = o.hard ? LS.first : (o.intro && o.hard===undefined) ? "intro" : o.study ? "study" : LS.first;
  if(LS.phase!=="intro"){ LS.qs = LS.build(topic, LS.hard); LS.total = LS.qs.length; }
  renderOverlay(); afterPhase();
}
function startLesson(id, hard){
  const topic = course().find(t=>t.id===id); if(!topic) return;
  startLS(topic, {study:true, hard, again:h=>startLesson(id, h)});
}
function reviewGroups(lang){
  const out = [];
  for(const lv of LEVELS){ const ts = COURSE[lang].filter(t=>t.lv===lv.id);
    for(let i=0;i<ts.length;i+=4) out.push({id:`rv-${lv.id}-${i/4+1}`, lv:lv.id, n:i/4+1, ts:ts.slice(i,i+4)}); }
  return out;
}
function startReview(id, hard){
  const g = reviewGroups(S.lang).find(g=>g.id===id); if(!g) return;
  const ws = shuffle(g.ts.flatMap(words)).slice(0,10);
  const topic = {id, lv:g.lv, review:true, t:`Повторение ${g.n} · ${g.lv}`, s:g.ts.map(t=>t.t).join(", "),
    ws, w:ws.map(w=>w.t+"|"+w.r), x:shuffle(g.ts.flatMap(t=>t.x)).slice(0,3), gq:shuffle(gqOf(S.lang, g.lv)).slice(0,3)};
  startLS(topic, {intro:true, hard, again:h=>startReview(id, h)});
}
function startPics(hard){
  const ws = shuffle(picPool(S.lang)).slice(0,12);
  startLS({id:"pics", game:true, lv:"", t:"Угадай по картинке", s:"12 случайных рисунков из всего курса", ws, x:[]},
    {intro:true, build:buildPics, hard, again:h=>startPics(h)});
}
function startDlg(id, hard){
  const d = DIALOGS[S.lang].find(x=>x.id===id); if(!d) return;
  startLS({id:"dl-"+id, dlg:true, d, lv:d.lv, t:d.t, s:d.s, ws:[], x:[]}, {intro:true, first:"dlisten", build:buildDlg, hard, again:h=>startDlg(id, h)});
}
function afterPhase(){
  if(!LS) return;
  if(LS.phase==="study"){ const w=words(LS.topic)[LS.si]; setTimeout(()=>{ if(LS && LS.phase==="study") speak(w.t, LS.lang); }, 250); }
  else if(LS.phase==="quiz") cueQ();
  else if(LS.phase==="dlisten") setTimeout(()=>{ if(LS && LS.phase==="dlisten") playDialog(.9); }, 400);
}
function cueQ(){ const q=LS.qs[LS.qi]; if(q && (q.ty==="listen"||q.ty==="dict"||q.ty==="lr")) setTimeout(()=>{ if(LS && LS.qs[LS.qi]===q) speak(q.w.t, LS.lang); }, 220); }
function goPhase(ph){
  LS.phase = ph;
  if(ph===LS.first && !LS.qs.length){ LS.qs = LS.build(LS.topic, LS.hard); LS.total = LS.qs.length; }
  renderOverlay(); afterPhase();
}
function stopSpeech(){ try{ ttsCap?.stop?.()?.catch?.(()=>{}); }catch(_){} if("speechSynthesis" in window) speechSynthesis.cancel(); }
function closeLesson(){
  if(BZ) clearInterval(BZ.timer);
  if(QS) clearInterval(QS.timer);

function dlgHtml(full){
  const d = LS.topic.d, show = full || LS.showText;

function playDialog(r){
  if(!LS || !LS.topic.dlg) return;
  const d = LS.topic.d, lang = LS.lang;
  if(ttsCap){ ttsCap.speak(d.lines.map(l=>l[1]).join(" "), {language: lang==="kk"?"kk":"en-US", rate:Math.max(.7,r)}).catch(e=>{ if(e?.code==="not_granted"){ ttsCap=null; playDialog(r); } }); return; }
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=> lang==="kk" ? /^kk/i.test(v.lang) : /^en[-_]US/i.test(v.lang));
  if(!vs.length){ speakLocal(d.lines[0][1], lang); return; }
  speechSynthesis.cancel();
  const mark = i => { if(!LS) return; LS.playing = i; document.querySelectorAll(".dl").forEach(e=>e.classList.toggle("on", +e.dataset.li===i)); };
  d.lines.forEach((l,i)=>{
    const u = new SpeechSynthesisUtterance(l[1]), v = vs[l[0] % vs.length];
    u.voice = v; u.lang = v.lang; u.rate = r; u.pitch = vs.length>1 ? 1 : (l[0] ? 1.25 : .85);
    u.onstart = ()=>mark(i); if(i===d.lines.length-1) u.onend = ()=>mark(-1);
    speechSynthesis.speak(u);
  });
}

      <div class="col">${m.right.map(w=>`<button class="opt ${m.done.has(w.key)?"gone":""} ${m.selR===w.key?"sel":""} ${m.flash===w.key?"wrong":""}" data-act="mr" data-k="${w.key}" ${m.done.has(w.key)?"disabled":""}>${esc(w.r)}</button>`).join("")}</div></div>`;
  }
  return "";
}
function checkAnswer(){
  const q = LS.qs[LS.qi]; if(LS.state || !hasAnswer(q)) return;
  let ok=false, lz=false;
  if(isTyped(q)){
    const a = norm(LS.sel), t = norm(q.ans);
    ok = a===t || a===t.replace(/^to /,"") || norm(q.ans.replace(/'/g,""))===a.replace(/'/g,"");
    if(!ok && LS.lang==="kk" && loose(LS.sel)===loose(q.ans)){ ok=true; lz=true; }
    if(!ok && q.ty==="dict" && lev(a.replace(/'/g,""), t.replace(/'/g,"")) <= Math.max(1, Math.floor(t.length*.06))){ ok=true; lz=true; }
  } else if(q.ty==="build"){
    const built = LS.sel.map(i=>q.toks.find(t=>t.i===i).x).join(" ");
    ok = norm(built)===norm(q.ans);
  } else ok = LS.sel===q.ans;
  finishQ(ok, lz);
  if(q.ty==="gq") speak(q.g.s.replace("___", q.ans), LS.lang);
  else if(q.w && q.ty!=="dict" && q.ty!=="lr" && (q.ty!=="t2r" || ok)) speak(q.ty==="build"?q.ans:q.w.t, LS.lang);
}
function finishQ(ok, lz=false){
  const q = LS.qs[LS.qi];
  LS.state = {ok, loose:lz};
  if(!q.retry){ if(ok) LS.right++; }
  if(ok){ LS.combo++; if(LS.combo>=3) LS.bonus++; sfx(LS.combo>=3 && LS.combo%3===0 ? "combo" : "good"); }
  else { LS.combo=0; sfx("bad"); }
  if(!ok){
    if(q.w) LS.wrong.add(q.w.key||"");
    if(!q.retry && q.ty!=="match"){
      const c = {...q, retry:true}; if(q.opts) c.opts = shuffle(q.opts); if(q.toks) c.toks = shuffle(q.toks);
      if(q.popts){ c.popts = shuffle(q.popts); c.opts = c.popts.map(p=>p.t); }
      LS.qs.push(c);
    }
  }
  renderOverlay();
}
function nextQ(){
  if(LS.mic && LS.mic.listening && dict) dict.stop().catch(()=>{});
  LS.mic=null; LS.sayRes=null;
  LS.qi++; LS.state=null; LS.sel=null;
  if(LS.qi>=LS.qs.length){
    if(LS.topic.dlg){ LS.phase="dbreak"; renderOverlay(); return; }
    return finishLesson();
  }
  renderOverlay(); cueQ();
}
function finishLesson(){
  const pct = Math.round(LS.right/Math.max(1,LS.total)*100), st = S.langs[LS.lang], T = LS.topic;

  if(LS.hard) xp = Math.round(xp*1.5);
  LS.xp = xp;
  if(LS.pass){ sfx("win"); setTimeout(confetti, 50); }
  if(LS.pass && !T.game){
    st.done[T.id] = Math.max(st.done[T.id]||0, pct);
    if(LS.hard) st.hard[T.id] = Math.max(st.hard[T.id]||0, pct);
    words(T).forEach(w=>{ if(!w.key) return;
      if(!st.cards[w.key]) st.cards[w.key] = {e:2.5, i:1, r:1, d:Date.now()+DAY};
      if(LS.wrong.has(w.key)) st.cards[w.key] = {...st.cards[w.key], d:Date.now(), r:0, i:0};

function qPath(from, to){
  if(!qWalk(to[0],to[1])) return null;
  const key = p => p[0]+","+p[1], prev = {[key(from)]:null}, qu = [from];
  while(qu.length){
    const c = qu.shift();
    if(c[0]===to[0] && c[1]===to[1]){ const path=[]; let p=c; while(prev[key(p)]!==null){ path.unshift(p); p=prev[key(p)]; } return path; }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=c[0]+dx, ny=c[1]+dy; if(qWalk(nx,ny) && !(key([nx,ny]) in prev)){ prev[key([nx,ny])]=c; qu.push([nx,ny]); } }
  }
  return null;
}
function qMoveMe(){ const me=$("#me"); if(me) me.style.transform = `translate(${QS.pos[0]*TS}px,${QS.pos[1]*TS}px)`; }
function qWalkTo(x, y){
  if(!QS || QS.phase!=="walk" || QS.talk) return;
  clearInterval(QS.timer);
  const path = qPath(QS.pos, [x,y]); if(!path) return;
  if(!path.length){ qArrive(); return; }
  QS.timer = setInterval(()=>{
    if(!QS) return;
    QS.pos = path.shift(); qMoveMe();
    if(!path.length){ clearInterval(QS.timer); setTimeout(()=>{ if(QS) qArrive(); }, 170); }
  }, 165);
}
function qStep([dx,dy]){ const nx=QS.pos[0]+dx, ny=QS.pos[1]+dy; if(!qWalk(nx,ny)) return; clearInterval(QS.timer); QS.pos=[nx,ny]; qMoveMe(); qArrive(); }
function qTap(e, svg){
  if(!QS || QS.phase!=="walk" || QS.talk) return;
  const r = svg.getBoundingClientRect();
  qWalkTo(Math.floor((e.clientX-r.left)/r.width*QW), Math.floor((e.clientY-r.top)/r.height*QH));
}
function qArrive(){ const pl = qPlaceAt(QS.pos[0], QS.pos[1]); if(pl) qTalk(pl); }
function qTalk(pl){
  const s = QS.q.st[QS.step];
  if(s && s[0]===pl){ QS.talk = {pl, phase:"line", opts:shuffle(s[2]), bad:[]}; speak(pair(s[1]).t, QS.lang); }
  else { QS.talk = {pl, phase:"idle"}; speak(pair(PLACES[QS.lang][pl][2]).t, QS.lang); }
  renderOverlay();
}
function qPick(v){
  const s = QS.q.st[QS.step];
  if(v===s[2][0]){ sfx("good"); QS.talk.phase="ok"; QS.step++; speak(pair(s[3]).t, QS.lang); }
  else { sfx("bad"); QS.talk.bad.push(v); QS.mist++; }
  renderOverlay();
}
function qNext(){
  const pl = QS.talk.pl;
  if(QS.step>=QS.q.st.length) return finishQuest();
  const s = QS.q.st[QS.step];
  if(s[0]===pl){ QS.talk = {pl, phase:"line", opts:shuffle(s[2]), bad:[]}; speak(pair(s[1]).t, QS.lang); }
  else QS.talk = null;
  renderOverlay();
}
function finishQuest(){
  const st = S.langs[QS.lang], n = QS.q.st.length, id = "qs-"+QS.q.id;
  const pct = Math.max(40, 100-QS.mist*15);
  QS.stars = QS.mist===0 ? 3 : QS.mist<=2 ? 2 : 1;
  QS.xp = Math.round((10+n*3)*(QS.hard?1.5:1));
  st.done[id] = Math.max(st.done[id]||0, pct);
  if(QS.hard) st.hard[id] = Math.max(st.hard[id]||0, pct);
  addXp(QS.xp); QS.phase="done"; QS.talk=null; sfx("win"); setTimeout(confetti, 50); renderOverlay();
}

/* ===================== PRONUNCIATION ===================== */
let PS = null;
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function pronScore(target, said){
  const f = s => loose(s).replace(/'/g,"");
  const T=f(target), H=f(said); if(!H) return {score:0, marks:[]};
  const hw = new Set(H.split(" "));
  const tw = target.replace(/[—–]/g," ").split(/\s+/).filter(w=>f(w));
  const marks = tw.map(w=>({w, ok: hw.has(f(w)) || [...hw].some(h=>f(w).length>3 && lev(h,f(w))<=1)}));
  const wordScore = marks.filter(m=>m.ok).length/Math.max(1,marks.length);
  const charScore = 1 - lev(T,H)/Math.max(T.length,H.length);
  return {score:Math.max(wordScore, charScore), marks};
}
function startPron(id){
  const lv = PRON[S.lang].find(p=>p.id===id);
  PS = {lang:S.lang, lv, i:0, best:[], heard:"", partial:"", res:null, listening:false, phase:"go"};
  renderOverlay(); setTimeout(()=>{ if(PS) speak(pair(lv.items[0]).t, PS.lang); }, 300);
}
function paintHeard(){
  const el = $("#heard"), M = micTarget(); if(!el || !M) return;
  el.innerHTML = `${esc(M.heard.trim())} <span class="part">${esc(M.partial)}</span>`;
}
function evalPron(){
  if(!PS || PS.res) return;
  const it = pair(PS.lv.items[PS.i]), said = (PS.heard+" "+PS.partial).trim();
  if(!said){ toast("Ничего не услышал. Нажмите на микрофон и говорите чуть громче."); renderOverlay(); return; }
  const r = pronScore(it.t, said);
  const stars = r.score>=.9?3 : r.score>=.72?2 : r.score>=.5?1 : 0;
  PS.res = {stars, marks:r.marks, said};
  sfx(stars>=2?"good":stars===1?"combo":"bad");
  renderOverlay();
}
function renderPron(){
  const root=$("#overlay-root"); document.body.style.overflow="hidden";
  const n = PS.lv.items.length;
  if(PS.phase==="done"){
    const total = PS.best.reduce((a,b)=>a+b,0), st = Math.round(total/n);
    root.innerHTML = shell(100, `<div class="result"><div class="label">Произношение · ${esc(PS.lv.t)}</div>${starsHtml(st)}
      <h2 class="q-title">${st===3?"Звучит как у носителя!":st===2?"Хорошее произношение":st===1?"Неплохо, есть что подтянуть":"Попробуйте ещё раз"}</h2>
      <p class="muted" style="margin:0;max-width:44ch">${total} из ${n*3} звёзд. +${PS.xp} XP. ${st<3?"Возвращайтесь сюда, чтобы добрать звёзды.":""}</p></div>`,
      `<div style="display:flex;gap:10px"><button class="btn ghost wide" data-act="pron" data-id="${PS.lv.id}">Ещё раз</button><button class="btn wide" data-act="close">Готово</button></div>`);
    return;
  }
  const it = pair(PS.lv.items[PS.i]), mic = micOk(PS.lang), r = PS.res;
  let body = `<div class="label">${esc(PS.lv.t)} · ${PS.i+1} из ${n}</div>
    <div class="study-card"><div class="w">${esc(it.t)}</div><div class="r">${esc(it.r)}</div>
      <div class="goal-sel" style="justify-content:center"><button class="btn ghost" style="padding:8px 14px" data-act="say" data-text="${esc(it.t)}">Послушать</button><button class="btn ghost" style="padding:8px 14px" data-act="sayslow" data-text="${esc(it.t)}">Медленно</button></div></div>`;
  let foot;
  if(r){
    body += `<div style="display:grid;gap:10px;justify-items:center">${starsHtml(r.stars)}
      ${r.self?"":`<div class="heard">${r.marks.map(m=>`<span class="${m.ok?"ok":"miss"}">${esc(m.w)}</span>`).join(" ")}</div><div class="note">Услышано: «${esc(r.said)}»</div>`}
      <div class="note" style="text-align:center">${r.stars===3?"Чисто и понятно.": r.stars===2?"Почти идеально. Подчёркнутые слова прозвучали нечётко.": "Послушайте медленную версию и повторите ещё раз."}</div></div>`;
    foot = `<div style="display:flex;gap:10px"><button class="btn ghost wide" data-act="pretry">Ещё раз</button><button class="btn wide" data-act="pnext">Дальше</button></div>`;
  } else if(mic){
    body += `<div style="display:grid;justify-items:center;gap:10px"><button class="mic ${PS.listening?"on":""}" data-act="mic" aria-label="${PS.listening?"Закончить":"Говорить"}">${ICON_MIC}</button>
      <div class="note">${PS.listening?"Говорите… нажмите ещё раз, когда закончите":"Нажмите и произнесите вслух"}</div><div class="heard" id="heard"></div></div>`;

  }
  root.innerHTML = shell((PS.i + (r?1:0))/n*100, body, foot, r ? (r.stars>=2?"ok":r.stars===0?"bad":"") : "");
  paintHeard();
}
function pronNext(){
  PS.best[PS.i] = Math.max(PS.best[PS.i]||0, PS.res.stars);

    const total = PS.best.reduce((a,b)=>a+b,0), st = Math.round(total/PS.lv.items.length);
    const P = S.langs[PS.lang].pron; P[PS.lv.id] = Math.max(P[PS.lv.id]||0, st);
    PS.xp = total*2; addXp(PS.xp); PS.phase="done";
    if(st>=2){ sfx("win"); setTimeout(confetti,50); }
    renderOverlay(); return;
  }

}

let BZ = null;
function blitzPool(lang){
  const c = allTopics(lang), st = S.langs[lang];
  let ts = c.filter(t=>t.id in st.done); if(ts.length<2) ts = c.slice(0,3);
  return ts.flatMap(words).filter(w=>w.t.split(" ").length<=4);
}
function startBlitz(){
  BZ = {lang:S.lang, pool:blitzPool(S.lang), score:0, combo:0, end:Date.now()+60000, phase:"play", q:null, wrong:false};
  blitzQ(); renderOverlay();
  BZ.timer = setInterval(()=>{
    if(!BZ || BZ.phase!=="play") return;
    const rem = BZ.end-Date.now();
    if(rem<=0) return endBlitz();
    const b=$("#bar"); if(b) b.style.width = (rem/600)+"%";
    const t=$("#bz-time"); if(t) t.textContent = Math.ceil(rem/1000)+" с";
  }, 100);
}
function blitzQ(){
  const p = BZ.pool, w = p[Math.random()*p.length|0];
  const ds = shuffle(p.filter(x=>x.r!==w.r)).slice(0,3);
  BZ.q = {w, opts:shuffle([w.r, ...ds.map(d=>d.r)])};
}
function blitzAnswer(v){
  if(!BZ || BZ.phase!=="play") return;
  if(v===BZ.q.w.r){ BZ.combo++; BZ.score += BZ.combo>=5?2:1; BZ.wrong=false; sfx(BZ.combo%5===0?"combo":"good"); }
  else { BZ.combo=0; BZ.end-=3000; BZ.wrong=true; sfx("bad"); toast(`${BZ.q.w.t} — ${BZ.q.w.r}`); }
  blitzQ(); renderOverlay();
}
function endBlitz(){
  clearInterval(BZ.timer); BZ.phase="done";
  const st = S.langs[BZ.lang]; BZ.record = BZ.score > (st.best||0);
  if(BZ.record){ st.best = BZ.score; sfx("win"); setTimeout(confetti,50); }
  if(BZ.score) addXp(BZ.score); else save();
  renderOverlay();
}
function renderBlitz(){
  const root=$("#overlay-root"); document.body.style.overflow="hidden";
  if(BZ.phase==="done"){
    root.innerHTML = shell(0, `<div class="result"><div class="label">Молния</div><div class="score">${BZ.score}</div>
      <h2 class="q-title">${BZ.record?"Новый рекорд!":"Время вышло"}</h2><p class="muted" style="margin:0">Рекорд: ${S.langs[BZ.lang].best}. +${BZ.score} XP.</p></div>`,
      `<div style="display:flex;gap:10px"><button class="btn ghost wide" data-act="close">Выйти</button><button class="btn wide" data-act="blitz">Ещё раунд</button></div>`);
    return;
  }
  const rem = Math.max(0, BZ.end-Date.now());
  const body = `<div class="bz-score ${BZ.wrong?"shake":"pop"}">${BZ.score}</div>
    <div style="text-align:center" class="note">${BZ.combo>=5?`<span class="combo">Серия ×${BZ.combo} · очки ×2</span>`:"5 верных подряд дают двойные очки. Ошибка отнимает 3 секунды."}</div>
    <div class="prompt" style="justify-content:center"><div class="p">${esc(BZ.q.w.t)}</div></div>
    <div class="options">${BZ.q.opts.map((o,i)=>`<button class="opt" data-act="bz" data-v="${esc(o)}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  root.innerHTML = shell(rem/600, body, `<div class="note" style="text-align:center">Клавиши 1–4 для быстрого ответа</div>`, "", `<b id="bz-time" style="font-variant-numeric:tabular-nums;min-width:44px;text-align:right">${Math.ceil(rem/1000)} с</b>`);
  const bar=$("#bar"); if(bar){ bar.style.background="var(--accent)"; bar.style.transition="none"; }
}

const getKey = () => { try{ return localStorage.getItem("ekitil.apikey")||""; }catch(e){ return ""; } };
/* outside claude.ai the partner can use the person's own Anthropic API key, stored only on this device */
function apiSample(){
  return { json: async (prompt, opts={})=>{
    const key = getKey(); if(!key) throw {code:"not_granted"};
    let res;
    try{
      res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST",
        headers:{ "content-type":"application/json", "x-api-key":key, "anthropic-version":"2026-10-21",
          "anthropic-beta":"server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model:"claude-opus-5-5", max_tokens:4000, output_config:{effort: opts.modelTier==="default" ? "medium" : "low"}, fallbacks:"default",
          messages:[{role:"user", content:prompt}] }) });
    }catch(e){ throw {code:"network"}; }
    if(res.status===401 || res.status===403) throw {code:"bad_key"};
    if(res.status===429) throw {code:"rate_limited"};
    if(!res.ok) throw {code:"upstream_error"};
    const data = await res.json();
    if(data.stop_reason==="refusal") throw {code:"refusal"};
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const a = text.indexOf("{"), b = text.lastIndexOf("}"); if(a<0||b<a) throw {code:"invalid_json"};
    return JSON.parse(text.slice(a,b+1));
  }};
}

      ${genErr?`<p class="note" style="margin:0;color:var(--bad)">${esc(genErr)}</p>`:""}`
    : `<p class="note" style="margin:0">Генератору нужен ИИ. На claude.ai он работает сразу. В версии для iPhone подключите свой API-ключ на вкладке «Собеседник».</p>`}
    ${mine.length?`<div class="label">Мои уроки · ${mine.length}</div><div class="mylist">${[...mine].reverse().map(t=>`<div class="myrow"><span class="badge" style="flex:none">${t.lv}</span><b>${esc(t.t)}</b><span>${esc(t.s)}</span><button data-act="start" data-id="${t.id}" aria-label="Открыть" style="color:var(--accent);font-size:15px">▶</button><button data-act="gendel" data-id="${t.id}" aria-label="Удалить урок">×</button></div>`).join("")}</div>`:""}
  </section>`;
}
function genPrompt(topic, lv){
  return `You write one lesson for a language-learning app. The learner speaks Russian and is learning ${langFullOf()} at CEFR level ${lv}.
Lesson topic requested by the learner (may be written in Russian): "${topic}".
${S.lang==="kk" ? "Use correct modern standard Kazakh in Cyrillic, as used in Kazakhstan today. Double-check spelling, vowel harmony and suffixes. Avoid rare, archaic or invented words. If you are not sure a word is correct Kazakh, choose a more common word." : "Use natural American English: US spelling and the words Americans actually use."}
Choose the 10 most useful words or short collocations for this topic at level ${lv} (not trivial basics like hello or thank you), and 3 natural sentences that use some of them.
Sentences: 4 to 10 words, no punctuation at all except apostrophes inside words.
Translations: short and natural Russian.
Reply with only JSON in this shape:
{"t":"lesson title in Russian, 1-3 words","s":"subtitle in Russian, 2-6 words","w":[["target word","перевод"]],"x":[["target sentence","перевод"]]}
"w" must have exactly 10 items and "x" exactly 3 items.`;
}
async function generateLesson(topic){
  if(genBusy || !sampleCap) return;
  const lv = genLv || myLevel(), lang = S.lang;
  genBusy = true; genErr = ""; render();
  try{
    const r = await sampleCap.json(genPrompt(topic, lv), {modelTier:"default", cache:false});
    const clean = v => String(v||"").replace(/[|\n]/g," ").replace(/\s+/g," ").trim();
    const pairs = a => Array.isArray(a) ? a.filter(p=>Array.isArray(p)&&p.length>=2).map(p=>[clean(p[0]),clean(p[1])]).filter(p=>p[0]&&p[1]) : [];
    const w = pairs(r?.w).slice(0,12), x = pairs(r?.x).map(p=>[p[0].replace(/[.,!?;:«»"]/g,"").replace(/\s+/g," ").trim(), p[1]]).slice(0,4);
    if(w.length<6 || x.length<1) throw {code:"invalid_json"};
    const t = {id:"g"+Date.now(), lv, t:clean(r.t)||topic, s:clean(r.s)||topic, w:w.map(p=>p.join("|")), x:x.map(p=>p.join("|")), gen:true, q:topic};
    S.langs[lang].gen.push(t); save();
    genBusy=false; toast("Урок готов");
    if(S.lang===lang) startLesson(t.id); else render();
    return;
  }catch(e){
    genErr = e?.code==="not_granted" ? "Разрешите приложению обращаться к Claude и попробуйте снова." : e?.code==="bad_key" ? "API-ключ не подошёл. Проверьте его на вкладке «Собеседник»." : e?.code==="network" ? "Нет интернета. Генератору нужна сеть." : e?.code==="rate_limited" ? "Слишком много запросов подряд. Подождите минуту." : "Не получилось составить урок. Попробуйте ещё раз или переформулируйте тему.";
  }
  genBusy=false; render();
}

/* ===================== EVENTS ===================== */
document.addEventListener("click", e=>{
  const mp = e.target.closest("#qmap"); if(mp && QS){ qTap(e, mp); return; }
  const gw = e.target.closest(".gw"); if(gw && !e.target.closest("[data-act]")){ speak(gw.textContent, gw.dataset.l); return; }
  const b = e.target.closest("[data-act],[data-tab],[data-lang]"); if(!b || b.disabled) return;
  if(b.dataset.tab){ ui.tab=b.dataset.tab; try{localStorage.setItem("ekitil.tab",ui.tab)}catch(_){}; render(); window.scrollTo(0,0); return; }
  if(b.dataset.lang && !b.dataset.act){ if(S.lang===b.dataset.lang) return; if(dict && CH?.listening) dict.stop().catch(()=>{}); S.lang=b.dataset.lang; rv=null; chatLv=null; genLv=null; genErr=""; loadChat(); save(); render(); window.scrollTo(0,0); return; }
  const a = b.dataset.act;
  switch(a){
    case "start": startLesson(b.dataset.id); break;
    case "goreview": ui.tab="review"; render(); break;
    case "say": speak(b.dataset.text, LS?LS.lang:QS?QS.lang:S.lang); break;
    case "close": closeLesson(); break;
    case "snext": { const n=words(LS.topic).length; if(LS.si<n-1){ LS.si++; renderOverlay(); speak(words(LS.topic)[LS.si].t, LS.lang);} else goPhase("quiz"); break; }
    case "sprev": LS.si=Math.max(0,LS.si-1); renderOverlay(); break;
    case "skipstudy": goPhase("quiz"); break;
    case "hardnow": LS.hard=true; LS.qs=LS.build(LS.topic, true); LS.total=LS.qs.length; goPhase("quiz"); break;
    case "lsgo": LS.hard=b.dataset.h==="1"; LS.qs=LS.build(LS.topic, LS.hard); LS.total=LS.qs.length; goPhase(LS.first); break;
    case "hardgo": LS.again(true); break;
    case "restartnorm": LS.again(false); break;
    case "startrev": startReview(b.dataset.id); break;
    case "pics": startPics(); break;
    case "dlg": startDlg(b.dataset.id); break;
    case "dplay": playDialog(.9); break;
    case "dslow": playDialog(.65); break;
    case "dline": speak(LS.topic.d.lines[+b.dataset.i][1], LS.lang); break;
    case "dtext": LS.showText=!LS.showText; renderOverlay(); break;
    case "dqgo": stopSpeech(); LS.playing=-1; goPhase("quiz"); break;
    case "dfinish": finishLesson(); break;
    case "lmic": lessonMic(); break;
    case "sayskip": skipSay(); break;
    case "sayself": LS.sayRes=null; finishQ(true); break;
    case "quest": startQuest(b.dataset.id); break;
    case "qgo": QS.hard=b.dataset.h==="1"; QS.phase="walk"; renderOverlay(); break;
    case "qopt": qPick(b.dataset.v); break;
    case "qnext": qNext(); break;
    case "qbye": QS.talk=null; renderOverlay(); break;
    case "qagain": startQuest(QS.q.id, QS.hard); break;
    case "qhard": startQuest(QS.q.id, true); break;
    case "qnorm": startQuest(QS.q.id, false); break;
    case "pick": if(!LS.state){ LS.sel=b.dataset.v; renderOverlay(); } break;
    case "check": checkAnswer(); break;
    case "next": nextQ(); break;
    case "restart": LS.again(LS.hard); break;
    case "kchar": { const tb=$("#typebox")||$("#chat-in"); if(!tb) break; const s=tb.selectionStart??tb.value.length; tb.value=tb.value.slice(0,s)+b.dataset.c+tb.value.slice(tb.selectionEnd??s); if(LS) LS.sel=tb.value; tb.focus(); tb.setSelectionRange(s+1,s+1); const cb=$("#check-btn"); if(cb) cb.disabled=!tb.value.trim(); break; }
    case "tok": { LS.sel=[...(LS.sel||[]), +b.dataset.i]; renderOverlay(); break; }
    case "untok": { LS.sel=(LS.sel||[]).filter(i=>i!==+b.dataset.i); renderOverlay(); break; }
    case "ml": case "mr": matchClick(a, b.dataset.k); break;
    case "review": rv={lang:S.lang, list:shuffle(dueCards().map(([k])=>k)).slice(0,30), i:0, shown:false}; render(); break;
    case "practice": rv={lang:S.lang, list:shuffle(Object.keys(L().cards)).slice(0,20), i:0, shown:false}; render(); break;
    case "reveal": rv.shown=true; render(); speak(wordByKey(rv.list[rv.i]).t); break;
    case "rate": { const k=rv.list[rv.i]; L().cards[k]=srs(L().cards[k]||{e:2.5,i:0,r:0}, +b.dataset.q); addXp(1); rv.i++; rv.shown=false; render(); break; }
    case "endreview": rv=null; render(); break;
    case "goal": S.goal=+b.dataset.g; save(); render(); break;
    case "sound": S.sound=!S.sound; save(); render(); break;
    case "blitz": if(BZ) clearInterval(BZ.timer); BZ=null; startBlitz(); break;
    case "bz": blitzAnswer(b.dataset.v); break;
    case "gopron": ui.tab="pron"; render(); window.scrollTo(0,0); break;
    case "pron": PS=null; startPron(b.dataset.id); break;
    case "locked": toast("Сначала пройдите предыдущий уровень"); break;
    case "sayslow": speak(b.dataset.text, PS?PS.lang:S.lang, .6); break;
    case "mic": micClick(); break;
    case "pself": dictNo[PS.lang]=true; renderOverlay(); break;
    case "prate": PS.res={stars:+b.dataset.n, self:true}; sfx("good"); renderOverlay(); break;
    case "pretry": PS.best[PS.i]=Math.max(PS.best[PS.i]||0, PS.res.stars); PS.res=null; PS.heard=""; PS.partial=""; renderOverlay(); break;
    case "pnext": pronNext(); break;
    case "chatlv": chatLv=b.dataset.lv; render(); break;
    case "chatgo": if(CH?.busy) break; CH={sc:b.dataset.id, lv:chatLv||myLevel(), turns:[], voice:true, busy:false, listening:false}; askChat(); break;
    case "chatnew": if(dict && CH?.listening) dict.stop().catch(()=>{}); CH=null; try{localStorage.removeItem("ekitil.chat."+S.lang)}catch(_){}; render(); break;
    case "chatvoice": CH.voice=!CH.voice; saveChat(); render(); break;
    case "chatru": { const t=CH.turns[+b.dataset.i]; t.showRu=!t.showRu; render(); break; }
    case "chatmic": if(CH.listening){ dict.stop().catch(()=>{}); } else { dict.start({language: S.lang==="kk"?"kk":"en-US"}).catch(err=>{ if(err?.code==="unavailable"||err?.code==="not_granted"){ dictNo[S.lang]=true; toast("Голосовой ввод здесь недоступен, пишите текстом"); render(); } }); } break;
    case "backup": { const txt = JSON.stringify(S);
      const done = ()=>toast("Копия скопирована. Сохраните её в Заметки или отправьте себе.");
      try{ navigator.clipboard.writeText(txt).then(done, ()=>{ const ta=$("#restore-text"); $("#restore-box").hidden=false; ta.value=txt; ta.select(); toast("Выделите текст и скопируйте его вручную"); }); }catch(_){ toast("Не удалось скопировать"); } break; }
    case "restore": { const bx=$("#restore-box"); bx.hidden=!bx.hidden; if(!bx.hidden) $("#restore-text").focus(); break; }
    case "restore-go": { try{ const o=JSON.parse($("#restore-text").value); if(!o||!o.langs) throw 0; S=Object.assign(freshState(), o); fixState(); save(); render(); toast("Прогресс восстановлен"); }catch(_){ toast("Это не похоже на резервную копию Екі тіл"); } break; }
    case "forgetkey": try{ localStorage.removeItem("ekitil.apikey"); }catch(_){}; sampleCap=null; render(); toast("Ключ удалён с устройства"); break;
    case "genlv": genLv=b.dataset.lv; render(); break;
    case "genidea": generateLesson(b.dataset.v); break;
    case "gendel": { if(b.dataset.armed){ const id=b.dataset.id, st=L(); st.gen=st.gen.filter(t=>t.id!==id); delete st.done[id]; Object.keys(st.cards).forEach(k=>{ if(k.startsWith(id+":")) delete st.cards[k]; }); save(); render(); toast("Урок удалён"); } else { b.dataset.armed="1"; b.textContent="Удалить?"; b.style.color="var(--bad)"; b.style.fontSize="13px"; } break; }
    case "kmy": { const tb=$("#my-t"); tb.value+=b.dataset.c; tb.focus(); break; }
    case "mydel": { const id=b.dataset.id; L().custom=L().custom.filter(c=>String(c.id)!==id); delete L().cards["my:"+id]; save(); render(); break; }
    case "reset": if(b.dataset.armed){ const lang=S.lang; S=freshState(); S.lang=lang; save(); render(); toast("Прогресс сброшен"); } else { b.dataset.armed="1"; b.textContent="Нажмите ещё раз, чтобы удалить весь прогресс"; b.style.color="var(--bad)"; } break;
  }
});
function matchClick(side, key){
  const q = LS.qs[LS.qi], m = q.m; m.flash=null;
  if(side==="ml") m.selL = key; else m.selR = key;
  if(side==="ml"){ const w=q.items.find(w=>w.key===key); speak(w.t, LS.lang); }
  if(m.selL && m.selR){
    if(m.selL===m.selR){ m.done.add(m.selL); }
    else { m.err++; m.flash=m.selR; const w=q.items.find(w=>w.key===m.selL); if(w) LS.wrong.add(w.key); }
    m.selL=null; m.selR=null;
  }
  if(m.done.size===q.items.length){ finishQ(m.err<=1); return; }
  renderOverlay();
}
document.addEventListener("input", e=>{ if(e.target.id==="typebox" && LS){ LS.sel=e.target.value; const c=$("#check-btn"); if(c) c.disabled=!e.target.value.trim(); }});
document.addEventListener("keydown", e=>{
  if(QS){
    if(e.key==="Escape"){ closeLesson(); return; }
    if(QS.phase==="walk" && !QS.talk){ const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]; if(d){ e.preventDefault(); qStep(d); } }
    else if(QS.talk){
      if(QS.talk.phase==="line" && /^[1-3]$/.test(e.key)){ const o=QS.talk.opts[+e.key-1]; if(o && !QS.talk.bad.includes(o)) qPick(o); }
      else if(e.key==="Enter"){ e.preventDefault(); if(QS.talk.phase==="ok") qNext(); else if(QS.talk.phase==="idle"){ QS.talk=null; renderOverlay(); } }
    }
    return;
  }
  if(BZ && BZ.phase==="play" && /^[1-4]$/.test(e.key)){ blitzAnswer(BZ.q.opts[+e.key-1]); return; }
  if((BZ||PS) && e.key==="Escape"){ closeLesson(); return; }
  if(LS && LS.phase==="quiz"){
    const q=LS.qs[LS.qi];
    if(e.key==="Enter"){ e.preventDefault(); if(LS.state) nextQ(); else checkAnswer(); return; }
    if(!LS.state && q.opts && q.ty!=="match" && /^[1-4]$/.test(e.key) && e.target.id!=="typebox"){ LS.sel=q.opts[+e.key-1]; renderOverlay(); }
    return;
  }
  if(LS && LS.phase==="study" && (e.key==="Enter"||e.key==="ArrowRight")){ e.preventDefault(); $('[data-act="snext"]')?.click(); return; }
  if(LS && e.key==="Escape"){ closeLesson(); return; }
  if(!LS && ui.tab==="review" && rv && rv.i<rv.list.length){
    if(e.key===" " && !rv.shown){ e.preventDefault(); $('[data-act="reveal"]')?.click(); }
    else if(rv.shown && /^[1-4]$/.test(e.key)){ $$rate(+e.key)?.click(); }
  }
});
const $$rate = n => document.querySelectorAll('[data-act="rate"]')[n-1];

render();
initCloud();
</script>
